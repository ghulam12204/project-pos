<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="login.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-content">
        <div class="login-content">
            <div class="logo-wrapper">
                <div class="logo-class">
                    <div class="logo-main">
                        <div class="logo-src">
                            <img src="/items/logo.png" alt="">
                        </div>
                    </div>
                </div>
            </div>
            <div class="title-wrapper">
                <div class="title-class">
                    <div class="title-main">
                        <span>Login</span>
                    </div>
                </div>
            </div>
            <div class="login-input-wrapper">
                <div class="login-input-class">
                    <div class="login-input-main">
                        <div class="input-password">
                            <input type="password" id="password-panel" placeholder="Password">
                        </div>
                        <div class="hide-icon-wrapper">
                            <div class="hide-icon-class">
                                <img src="/items/eye-line.svg" alt="">
                            </div>
                        </div>
                        <div class="icon-left-wrapper">
                            <div class="left-icon-class">
                                <img src="/items/arrow-right-line.svg" alt="">
                            </div>

                        </div>
                    </div>
                    <div class="forgot-password-class">
                        <span>
                            <a href="">Forgot Password?</a>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="login.js"></script>
</body>

</html>
